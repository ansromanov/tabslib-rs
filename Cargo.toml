[package]
name = "tabslib"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A general-purpose tablature library: an immutable document model for fretted-instrument notation, codecs for the formats that carry it, and deterministic edits."
license = "MIT"
repository = "https://github.com/ansromanov/tabslib-rs"
keywords = ["tablature", "notation", "music", "score", "fretboard"]
categories = ["parser-implementations", "multimedia::audio"]

[dependencies]
quick-xml = "0.36"
zip = { version = "2", default-features = false, features = ["deflate"] }
thiserror = "1"

[dev-dependencies]

[profile.release]
opt-level = 3
