[package]
name = "tabslib"
version = "0.1.1"
edition = "2021"
rust-version = "1.88"
description = "A general-purpose tablature and music-generation library with an immutable document model, codecs, analysis, and deterministic edits."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ansromanov/tabslib-rs"
homepage = "https://ansromanov.github.io/tabslib-rs/"
documentation = "https://docs.rs/tabslib"
readme = "README.md"
keywords = ["tablature", "notation", "music", "score", "fretboard"]
categories = ["parser-implementations", "multimedia::audio"]
include = [
    "/src/**",
    "/tests/**",
    "/examples/**",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[package.metadata.docs.rs]
all-features = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
quick-xml = { version = "0.42", optional = true }
zip = { version = "9.8", default-features = false, features = ["deflate"], optional = true }
rustysynth = { version = "1.3.6", optional = true }

[dependencies.reqwest]
version = "0.13.5"
default-features = false
features = ["blocking", "json", "rustls"]
optional = true

[features]
default = ["gp", "ascii", "html", "pdf", "drums", "rhythm", "arrangement", "assessment", "harmony", "riffs", "json"]
# The .gp container and its XML payload. Reads and writes.
gp = ["dep:zip", "dep:quick-xml"]
ascii = []
html = []
pdf = []
midi = []
musicxml = ["dep:quick-xml"]
wav = ["dep:rustysynth"]
ai = ["assessment"]
# Shared HTTP transport for the connectors below; enable a connector, not this.
ai-http = ["ai", "dep:reqwest"]
ai-ollama = ["ai-http"]
ai-openai-compatible = ["ai-http"]
ai-gemini = ["ai-http"]
ai-anthropic = ["ai-http"]
arrangement = []
assessment = []
drums = []
harmony = []
rhythm = ["drums"]
# Authoring a riff from a declarative specification.
riffs = []
json = []

[dev-dependencies]

[[example]]
name = "native_generation"
required-features = ["gp", "drums", "rhythm", "harmony", "arrangement", "assessment"]

[[test]]
name = "bugfixes"
required-features = ["midi", "ascii", "gp"]

[[test]]
name = "arrangement_plan_surface"
required-features = ["ai", "ascii", "arrangement"]
