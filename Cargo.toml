[package]
name = "tabslib"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A general-purpose tablature library: an immutable document model for fretted-instrument notation, codecs for the formats that carry it, and deterministic edits."
license = "MIT"
repository = "https://github.com/ansromanov/tabslib-rs"
keywords = ["tablature", "notation", "music", "score", "fretboard"]
categories = ["parser-implementations", "multimedia::audio"]

[dependencies]
thiserror = "1"
quick-xml = { version = "0.36", optional = true }
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }

[features]
default = ["gp", "ascii"]
# The .gp container and its XML payload. Reads and writes.
gp = ["dep:zip", "dep:quick-xml"]
ascii = []
midi = []
musicxml = []
wav = []

[dev-dependencies]

[profile.release]
opt-level = 3
