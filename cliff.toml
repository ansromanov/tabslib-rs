[changelog]
header = "# Tabslib changelog\n"
body = """
{% if version %}## {{ version }} - {{ timestamp | date(format="%Y-%m-%d") }}{% else %}## Unreleased{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}- {{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})\n{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
initial_tag = "0.1.0"
no_increment_regex = "^(build|chore|ci|docs|refactor|test)(\\([^)]*\\))?:"

[git]
conventional_commits = true
filter_unconventional = false
protect_breaking_commits = true
commit_parsers = [
  { message = "^[a-z]+(\\([^)]*\\))?!:", group = "Breaking Changes", bump = "major" },
  { body = "BREAKING CHANGE", group = "Breaking Changes", bump = "major" },
  { message = "^feat", group = "Features", bump = "minor" },
  { message = "^fix", group = "Bug Fixes", bump = "patch" },
  { message = "^perf", group = "Performance", bump = "patch" },
  { message = "^.*", skip = true },
]
